media:
  - name: images
    label: Website images
    input: assets/uploads
    output: /assets/uploads
    rename: safe
    extensions: [jpg, jpeg, png, webp]

components:
  page_image:
    type: object
    fields:
      - name: image
        label: Image
        type: image
        required: true
        options:
          media: images
      - name: alt
        label: Image description
        type: string
        required: true
        description: Describe the image for people using screen readers.
        options:
          maxlength: 160

content:
  - name: site_images
    label: Page images
    type: file
    path: content/site-images.json
    format: json
    fields:
      - name: home_hero_art
        label: Homepage hero artwork
        component: page_image
      - name: home_approach_visual
        label: Homepage approach image
        component: page_image
      - name: home_sectors_project_visual
        label: Homepage sectors left image
        component: page_image
      - name: home_sectors_growth_visual
        label: Homepage sectors right image
        component: page_image
      - name: home_field_main
        label: Fieldwork collage main image
        component: page_image
      - name: home_field_tall
        label: Fieldwork collage tall image
        component: page_image
      - name: home_field_wide
        label: Fieldwork collage wide image
        component: page_image
      - name: home_field_small
        label: Fieldwork collage small image
        component: page_image
      - name: home_gallery_card
        label: Homepage Gallery card
        component: page_image
      - name: home_blog_card
        label: Homepage Blog card
        component: page_image
      - name: home_contact_visual
        label: Homepage contact artwork
        component: page_image
      - name: about_hero
        label: About page hero image
        component: page_image
      - name: expertise_hero
        label: Expertise page hero image
        component: page_image
      - name: approach_hero
        label: Approach page hero image
        component: page_image
      - name: sectors_hero
        label: Sectors page hero image
        component: page_image
      - name: gallery_hero_main
        label: Gallery page main hero image
        component: page_image
      - name: gallery_hero_accent
        label: Gallery page accent image
        component: page_image

  - name: gallery
    label: Gallery images
    type: file
    path: content/gallery.json
    format: json
    list: true
    fields:
      - name: image
        label: Image
        type: image
        required: true
        options:
          media: images
      - name: caption
        label: Caption
        type: string
        required: true
        options:
          maxlength: 100
      - name: alt
        label: Image description
        type: string
        required: true
        description: Describe the image for people using screen readers.
        options:
          maxlength: 160
      - name: category
        label: Category
        type: string
        required: true
        options:
          maxlength: 40
      - name: layout
        label: Card size
        type: select
        required: true
        default: standard
        options:
          values:
            - name: standard
              label: Standard
            - name: wide
              label: Wide
            - name: tall
              label: Tall
      - name: published
        label: Show on website
        type: boolean
        default: true

  - name: blog
    label: Blog posts
    type: file
    path: content/blog.json
    format: json
    list: true
    fields:
      - name: slug
        label: URL name
        type: string
        required: true
        description: Lowercase words separated by hyphens, for example building-stronger-systems.
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: Use lowercase letters, numbers and hyphens only.
      - name: title
        label: Title
        type: string
        required: true
        options:
          maxlength: 120
      - name: category
        label: Category
        type: string
        required: true
        options:
          maxlength: 50
      - name: date
        label: Publication date
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: excerpt
        label: Short introduction
        type: text
        required: true
        options:
          minlength: 30
          maxlength: 240
      - name: image
        label: Cover image
        type: image
        required: true
        options:
          media: images
      - name: image_alt
        label: Cover image description
        type: string
        required: true
        options:
          maxlength: 160
      - name: body
        label: Article body
        type: rich-text
        required: true
        options:
          format: html
          media: images
          path: blog
          rename: safe
      - name: featured
        label: Feature at the top
        type: boolean
        default: false
      - name: published
        label: Show on website
        type: boolean
        default: true

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "Add {name} via Pages CMS"
      update: "Update {name} via Pages CMS"
      delete: "Remove {name} via Pages CMS"
      rename: "Rename {oldFilename} to {newFilename} via Pages CMS"
